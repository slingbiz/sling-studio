<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https:; style-src 'unsafe-inline' https:; font-src https: data:; img-src data: https:; connect-src https://unpkg.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>Sling widget preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      #sling-sandbox-root {
        min-height: 100vh;
        padding: 12px;
        box-sizing: border-box;
      }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@material-ui/core@4.12.4/umd/material-ui.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.6/babel.min.js"></script>
    <script src="https://unpkg.com/formik@2.2.9/dist/formik.umd.production.min.js"></script>
  </head>
  <body>
    <div id="sling-sandbox-root"></div>
    <script>
      (function () {
        var PARENT_MESSAGE_SOURCE = 'sling-studio-parent';
        var SANDBOX_MESSAGE_SOURCE = 'sling-sandbox';
        var params = new URLSearchParams(window.location.search);
        var nonce = params.get('nonce');
        var mount = document.getElementById('sling-sandbox-root');

        function postToParent(type, payload) {
          if (window.parent === window) return;
          var message = {source: SANDBOX_MESSAGE_SOURCE, type: type};
          if (payload) {
            Object.keys(payload).forEach(function (key) {
              message[key] = payload[key];
            });
          }
          window.parent.postMessage(message, '*');
        }

        function ligatureIcon(name) {
          return function IconLigature(props) {
            return React.createElement(MaterialUI.Icon, props || {}, name);
          };
        }

        var ICON_MAP = {
          Add: 'add',
          ArrowForward: 'arrow_forward',
          AttachMoney: 'attach_money',
          Check: 'check',
          CheckCircle: 'check_circle',
          Close: 'close',
          Delete: 'delete',
          Edit: 'edit',
          Email: 'email',
          ExpandLess: 'expand_less',
          ExpandMore: 'expand_more',
          Favorite: 'favorite',
          Home: 'home',
          Info: 'info',
          Lock: 'lock',
          Person: 'person',
          Phone: 'phone',
          Search: 'search',
          Settings: 'settings',
          ShoppingCart: 'shopping_cart',
          Star: 'star',
          Visibility: 'visibility',
          VisibilityOff: 'visibility_off',
          Warning: 'warning',
        };

        function buildScope(themeOverrides) {
          var scope = {
            React: React,
            useState: React.useState,
            useEffect: React.useEffect,
            useCallback: React.useCallback,
            useMemo: React.useMemo,
            useRef: React.useRef,
            useContext: React.useContext,
            PropTypes: {func: function () {}, node: function () {}, any: function () {}},
            clsx: function () {
              return Array.prototype.slice.call(arguments).filter(Boolean).join(' ');
            },
          };

          Object.keys(MaterialUI).forEach(function (key) {
            if (!/^[A-Z]/.test(key) || !MaterialUI[key]) return;
            var value = MaterialUI[key];
            // MUI Box/Typography/Paper are forwardRef objects, not functions.
            if (typeof value === 'function' || typeof value === 'object') {
              scope[key] = value;
            }
          });

          Object.keys(ICON_MAP).forEach(function (key) {
            scope[key] = ligatureIcon(ICON_MAP[key]);
            scope[key + 'Icon'] = scope[key];
          });

          if (window.Formik) {
            scope.Formik = window.Formik.Formik || window.Formik;
            scope.Form = window.Formik.Form;
            scope.Field = window.Formik.Field;
            scope.useField = window.Formik.useField;
          }

          var createTheme = MaterialUI.createMuiTheme || MaterialUI.createTheme;
          var theme = createTheme(
            themeOverrides && themeOverrides.palette
              ? {
                  palette: themeOverrides.palette,
                  typography: themeOverrides.typography || {},
                }
              : {
                  palette: {primary: {main: '#ff9800'}},
                  typography: {button: {textTransform: 'none'}},
                },
          );
          var ThemeProvider = MaterialUI.ThemeProvider;
          scope.ThemedComponent = function ThemedComponent(props) {
            return React.createElement(ThemeProvider, {theme: theme}, props.children);
          };
          scope.makeStyles = MaterialUI.makeStyles;
          return scope;
        }

        function renderCode(code, themeOverrides) {
          try {
            if (!code || !window.Babel || !window.MaterialUI) {
              throw new Error('Preview runtime is not ready.');
            }
            var scope = buildScope(themeOverrides);
            var transpiled = Babel.transform(code, {presets: ['react']}).code;
            var ThemedComponent = scope.ThemedComponent;
            var keys = Object.keys(scope).filter(function (key) {
              return key !== 'ThemedComponent' && /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(key);
            });
            var prelude = keys
              .map(function (key) {
                return 'var ' + key + ' = __scope[' + JSON.stringify(key) + '];';
              })
              .join('\n');
            var factory = new Function(
              '__scope',
              prelude +
                '\n' +
                transpiled +
                '\n' +
                'if (typeof PreviewComponent === "function") return PreviewComponent;\n' +
                'if (typeof Component === "function") return Component;\n' +
                'return null;',
            );
            var Component = factory(scope);
            if (typeof Component !== 'function') {
              throw new Error('Generated code did not define a PreviewComponent.');
            }
            ReactDOM.render(
              React.createElement(ThemedComponent, null, React.createElement(Component)),
              mount,
            );
            postToParent('RENDER_SUCCESS', {nonce: nonce, height: document.body.scrollHeight});
          } catch (error) {
            postToParent('RENDER_ERROR', {
              nonce: nonce,
              message: (error && error.message) || 'Failed to render generated widget.',
            });
          }
        }

        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return;
          var data = event.data;
          if (!data || data.source !== PARENT_MESSAGE_SOURCE) return;
          if (!nonce || data.nonce !== nonce) return;
          if (data.type === 'RENDER') {
            renderCode(data.code, data.themeOverrides);
          }
        });

        postToParent('READY', {});
        window.setInterval(function () {
          if (nonce) postToParent('READY', {});
        }, 400);
      })();
    </script>
  </body>
</html>
