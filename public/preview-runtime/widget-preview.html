<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https:; style-src 'unsafe-inline' https:; font-src https: data:; img-src data: https:; connect-src https://unpkg.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>Sling widget preview</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        height: 100%;
        overflow: auto;
      }
      html.sling-fit,
      html.sling-fit body {
        height: auto;
        overflow: hidden;
      }
      #sling-sandbox-root {
        min-height: 100%;
        min-width: 100%;
        width: max-content;
        padding: 8px;
        box-sizing: border-box;
      }
      html.sling-fit #sling-sandbox-root {
        min-height: 0;
        min-width: 0;
        width: 100%;
        padding: 0;
      }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@material-ui/core@4.12.4/umd/material-ui.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.6/babel.min.js"></script>
    <script src="https://unpkg.com/formik@2.2.9/dist/formik.umd.production.min.js"></script>
  </head>
  <body>
    <div id="sling-sandbox-root"></div>
    <script>
      (function () {
        var PARENT_MESSAGE_SOURCE = 'sling-studio-parent';
        var SANDBOX_MESSAGE_SOURCE = 'sling-sandbox';
        var params = new URLSearchParams(window.location.search);
        var nonce = params.get('nonce');
        var mount = document.getElementById('sling-sandbox-root');
        var resizeObserver = null;

        function contentHeight() {
          var rootHeight = mount ? mount.scrollHeight : 0;
          return Math.ceil(Math.max(rootHeight, document.body.scrollHeight, 1));
        }

        function reportHeight() {
          if (!nonce) return;
          postToParent('HEIGHT', {nonce: nonce, height: contentHeight()});
        }

        function postToParent(type, payload) {
          if (window.parent === window) return;
          var message = {source: SANDBOX_MESSAGE_SOURCE, type: type};
          if (payload) {
            Object.keys(payload).forEach(function (key) {
              message[key] = payload[key];
            });
          }
          window.parent.postMessage(message, '*');
        }

        function ligatureIcon(name) {
          return function IconLigature(props) {
            return React.createElement(MaterialUI.Icon, props || {}, name);
          };
        }

        var ICON_MAP = {
          Add: 'add',
          ArrowForward: 'arrow_forward',
          AttachMoney: 'attach_money',
          Check: 'check',
          CheckCircle: 'check_circle',
          Close: 'close',
          Delete: 'delete',
          Edit: 'edit',
          Email: 'email',
          ExpandLess: 'expand_less',
          ExpandMore: 'expand_more',
          Favorite: 'favorite',
          Home: 'home',
          Info: 'info',
          Lock: 'lock',
          Person: 'person',
          Phone: 'phone',
          Search: 'search',
          Settings: 'settings',
          ShoppingCart: 'shopping_cart',
          Speed: 'speed',
          Star: 'star',
          Storage: 'storage',
          Timer: 'timer',
          TrendingUp: 'trending_up',
          Visibility: 'visibility',
          VisibilityOff: 'visibility_off',
          Warning: 'warning',
        };

        function buildScope(themeOverrides) {
          var scope = {
            React: React,
            useState: React.useState,
            useEffect: React.useEffect,
            useCallback: React.useCallback,
            useMemo: React.useMemo,
            useRef: React.useRef,
            useContext: React.useContext,
            PropTypes: {func: function () {}, node: function () {}, any: function () {}},
            clsx: function () {
              return Array.prototype.slice.call(arguments).filter(Boolean).join(' ');
            },
          };

          Object.keys(MaterialUI).forEach(function (key) {
            if (!/^[A-Z]/.test(key) || !MaterialUI[key]) return;
            var value = MaterialUI[key];
            // MUI Box/Typography/Paper are forwardRef objects, not functions.
            if (typeof value === 'function' || typeof value === 'object') {
              scope[key] = value;
            }
          });

          Object.keys(ICON_MAP).forEach(function (key) {
            scope[key] = ligatureIcon(ICON_MAP[key]);
            scope[key + 'Icon'] = scope[key];
          });

          if (window.Formik) {
            scope.Formik = window.Formik.Formik || window.Formik;
            scope.Form = window.Formik.Form;
            scope.Field = window.Formik.Field;
            scope.useField = window.Formik.useField;
          }

          var createTheme = MaterialUI.createMuiTheme || MaterialUI.createTheme;
          var theme = createTheme(
            themeOverrides && themeOverrides.palette
              ? {
                  palette: themeOverrides.palette,
                  typography: themeOverrides.typography || {},
                }
              : {
                  palette: {primary: {main: '#ff9800'}},
                  typography: {button: {textTransform: 'none'}},
                },
          );
          fillPaletteShades(theme.palette);
          var ThemeProvider = MaterialUI.ThemeProvider;
          var PreviewErrorBoundary = (function () {
            function PreviewErrorBoundary(props) {
              React.Component.call(this, props);
              this.state = {failed: false};
            }
            PreviewErrorBoundary.prototype = Object.create(React.Component.prototype);
            PreviewErrorBoundary.prototype.componentDidCatch = function (error) {
              this.setState({failed: true});
              showError((error && error.message) || 'Preview failed');
              postToParent('RENDER_ERROR', {
                nonce: nonce,
                message: (error && error.message) || 'Preview failed',
              });
            };
            PreviewErrorBoundary.prototype.render = function () {
              if (this.state.failed) return null;
              return this.props.children;
            };
            return PreviewErrorBoundary;
          })();
          scope.ThemedComponent = function ThemedComponent(props) {
            return React.createElement(
              ThemeProvider,
              {theme: theme},
              React.createElement(PreviewErrorBoundary, null, props.children),
            );
          };
          scope.makeStyles = MaterialUI.makeStyles;
          return scope;
        }

        function fillPaletteShades(palette) {
          if (!palette) return;
          function withShades(color, fallbackMain) {
            if (typeof color === 'string') color = {main: color};
            if (!color || typeof color !== 'object') color = {main: fallbackMain};
            var main = color.main || color[500] || fallbackMain;
            if (!color.main) color.main = main;
            if (color[400] == null) color[400] = color.light || main;
            if (color[500] == null) color[500] = main;
            if (color[600] == null) color[600] = color.dark || main;
            if (color[300] == null) color[300] = color.light || main;
            return color;
          }
          palette.primary = withShades(palette.primary, '#ff9800');
          palette.secondary = withShades(palette.secondary, '#163a5f');
          palette.error = withShades(palette.error, '#d32f2f');
          var grey = palette.grey && typeof palette.grey === 'object' ? palette.grey : {};
          var gray = palette.gray && typeof palette.gray === 'object' ? palette.gray : {};
          palette.grey = Object.assign(
            {
              50: '#fafafa',
              100: '#f5f5f5',
              200: '#eeeeee',
              300: '#e0e0e0',
              400: '#bdbdbd',
              500: '#9e9e9e',
              600: '#757575',
              700: '#616161',
              800: '#424242',
              900: '#212121',
              A100: '#d5d5d5',
              A200: '#aaaaaa',
              A400: '#303030',
              A700: '#616161',
            },
            grey,
            gray,
          );
          if (palette.grey[400] == null) palette.grey[400] = '#bdbdbd';
          if (!palette.common) palette.common = {black: '#000', white: '#fff'};
        }

        function sanitizeCode(code) {
          return String(code || '')
            .replace(/^\s*import\s+[\s\S]*?;?\s*$/gm, '')
            .replace(/export\s+default\s+/, '')
            .replace(/export\s+/, '');
        }

        function inferComponentName(code) {
          var patterns = [
            /function\s+([A-Z][A-Za-z0-9_]*)\s*\(/,
            /(?:const|let|var)\s+([A-Z][A-Za-z0-9_]*)\s*=/,
            /class\s+([A-Z][A-Za-z0-9_]*)\s+/,
          ];
          for (var i = 0; i < patterns.length; i++) {
            var match = code.match(patterns[i]);
            if (match && match[1] !== 'ThemedComponent') return match[1];
          }
          return null;
        }

        function showError(message) {
          mount.innerHTML = '';
          var el = document.createElement('div');
          el.setAttribute('data-preview-error', '1');
          el.style.cssText =
            'padding:16px;font:14px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;color:#b71c1c;';
          el.textContent = message || 'Preview failed';
          mount.appendChild(el);
        }

        function renderCode(code, themeOverrides) {
          try {
            if (!code || !window.Babel || !window.MaterialUI) {
              throw new Error('Preview runtime is not ready.');
            }
            var clean = sanitizeCode(code);
            var inferred = inferComponentName(clean);
            var scope = buildScope(themeOverrides);
            var transpiled = Babel.transform(clean, {presets: ['react']}).code;
            var ThemedComponent = scope.ThemedComponent;
            var keys = Object.keys(scope).filter(function (key) {
              return key !== 'ThemedComponent' && /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(key);
            });
            var prelude = keys
              .map(function (key) {
                return 'var ' + key + ' = __scope[' + JSON.stringify(key) + '];';
              })
              .join('\n');
            var resolve =
              'if (typeof PreviewComponent === "function") return PreviewComponent;\n' +
              'if (typeof Component === "function") return Component;\n' +
              (inferred ? 'if (typeof ' + inferred + ' === "function") return ' + inferred + ';\n' : '') +
              'return null;';
            var factory = new Function('__scope', prelude + '\n' + transpiled + '\n' + resolve);
            var Component = factory(scope);
            if (typeof Component !== 'function') {
              throw new Error('Generated code did not define a PreviewComponent.');
            }
            ReactDOM.render(
              React.createElement(ThemedComponent, null, React.createElement(Component)),
              mount,
            );
            postToParent('RENDER_SUCCESS', {nonce: nonce, height: contentHeight()});
            reportHeight();
            if (window.ResizeObserver) {
              if (resizeObserver) resizeObserver.disconnect();
              resizeObserver = new ResizeObserver(function () {
                reportHeight();
              });
              resizeObserver.observe(mount);
            }
          } catch (error) {
            var message = (error && error.message) || 'Failed to render generated widget.';
            showError(message);
            postToParent('RENDER_ERROR', {
              nonce: nonce,
              message: message,
            });
          }
        }

        window.addEventListener('message', function (event) {
          if (event.source !== window.parent) return;
          var data = event.data;
          if (!data || data.source !== PARENT_MESSAGE_SOURCE) return;
          if (!nonce || data.nonce !== nonce) return;
          if (data.type === 'RENDER') {
            if (data.fitContent) {
              document.documentElement.classList.add('sling-fit');
            } else {
              document.documentElement.classList.remove('sling-fit');
            }
            renderCode(data.code, data.themeOverrides);
          }
        });

        postToParent('READY', {});
        window.setInterval(function () {
          if (nonce) postToParent('READY', {});
        }, 400);
      })();
    </script>
  </body>
</html>
